<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Analyze Spark profiler files in one browser workspace."><title>Spark Profile Tools</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><nav class="topnav"><a class="brand" href="../">Profiler Utils</a><a href="../spark-config-check/">Configuration Checker</a></nav><h1>Spark Profile Tools</h1><p class="lead">Load a Spark link or upload a <code>.sparkprofile</code> once, then use the same profile for thread summaries, plugin attribution, and CPU cleaning. Profile processing stays in your browser.</p><div class="loader"><input id="sparkUrl" autocomplete="off" placeholder="https://spark.lucko.me/… or report code"><button id="loadSpark">Load Spark report</button></div><div id="drop" class="drop">or <button id="chooseFile">choose a .sparkprofile</button> / drop it here</div><input id="file" type="file" accept=".sparkprofile,application/octet-stream" hidden><p id="loadStatus" class="status"></p><p id="loadError" class="error"></p><div class="cachebar"><span id="cacheStatus">Checking cache…</span><div class="cache-actions"><button id="viewCache" type="button">View cache</button><button id="clearCache" type="button">Clear cache</button></div></div><section id="cacheManager" class="cache-manager" hidden><div class="cache-manager-head"><div><strong>Cached profiles</strong><div id="cacheManagerSummary" class="muted"></div></div><button id="closeCache" type="button">Close</button></div><div id="cacheList" class="cache-list"></div></section><section id="workspace" hidden><div id="loaded" class="loaded"></div><div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="threads">Threads</button><button class="tab" data-tab="attribution">Resource Attribution</button><button class="tab" data-tab="cleaner" id="cleanTab">CPU Cleaner</button></div><section class="pane" id="overview"></section><section class="pane" id="threads" hidden><div class="control"><label>Minimum %<input class="small" id="threadThreshold" type="number" min="0" max="100" step="0.1" value="1"></label><div class="copy-actions"><button id="copyThreads" type="button">Copy</button><button id="copyThreadsAnsi" type="button">Copy ANSI</button></div></div><div id="threadsOut"></div></section><section class="pane" id="attribution" hidden><div class="control"><label>Thread name contains (optional)<input id="threadFilter" placeholder="e.g. Netty"></label><div class="copy-actions"><button id="copyAttr" type="button">Copy</button><button id="copyAttrAnsi" type="button">Copy ANSI</button></div></div><div id="attrOut"></div></section><section class="pane" id="cleaner" hidden><div class="actions"><button id="runClean">Remove idle/blocking samples</button><button id="downloadClean" disabled>Download cleaned profile</button></div><div id="cleanOut"></div></section></section></main><script src="./app.js"></script></body></html>
