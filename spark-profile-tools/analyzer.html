<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spark Resource Analyzer</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#111;color:#eee}body{max-width:980px;margin:40px auto;padding:0 20px}h1{font-size:24px} .drop{border:2px dashed #555;border-radius:12px;padding:38px;text-align:center;cursor:pointer;background:#181818}.drop.drag{border-color:#aaa;background:#222}input[type=file]{display:none}.controls{display:flex;gap:12px;align-items:end;margin:18px 0;flex-wrap:wrap}label{font-size:13px;color:#bbb}input[type=text]{display:block;margin-top:5px;background:#1c1c1c;color:#fff;border:1px solid #444;border-radius:6px;padding:9px 10px}.meta{color:#aaa;font-size:13px;margin:12px 0}.error{color:#ff9a9a;white-space:pre-wrap}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px 12px;border-bottom:1px solid #333;text-align:right}th:first-child,td:first-child{text-align:left}th{color:#bbb;font-size:12px;text-transform:uppercase}td{font-variant-numeric:tabular-nums}.muted{color:#888}.note{font-size:12px;color:#888;margin-top:16px}</style></head><body>
<h1>Spark Resource Analyzer</h1><div id="drop" class="drop"><strong>Drop a .sparkprofile here</strong><br><span class="muted">or click to choose a file — processing stays in this browser</span></div><input id="file" type="file" accept=".sparkprofile,application/octet-stream">
<div class="controls"><label>Thread filter<input id="filter" type="text" value="netty" placeholder="netty (blank = all)"></label></div><div id="meta" class="meta"></div><div id="error" class="error"></div><div id="out"></div>
<div class="note">Execution: 50 MSPT = 100% of one CPU core. Allocation percentage is relative to all exclusive sampled allocations in the selected thread(s).</div>
<script>
'use strict';
const td=new TextDecoder();
function readVarint(b,p){let v=0n,s=0n;for(;;){if(p>=b.length)throw Error('truncated varint');let x=b[p++];v|=BigInt(x&127)<<s;if(!(x&128))return [Number(v),p];s+=7n;if(s>70n)throw Error('invalid varint')}}
function* fields(b){let p=0;while(p<b.length){let t;[t,p]=readVarint(b,p);let n=t>>3,w=t&7,v;if(w===0){[v,p]=readVarint(b,p)}else if(w===1){v=b.slice(p,p+8);p+=8}else if(w===2){let z;[z,p]=readVarint(b,p);v=b.slice(p,p+z);p+=z}else if(w===5){v=b.slice(p,p+4);p+=4}else throw Error('unsupported protobuf wire type '+w);yield[n,w,v]}}
const text=b=>td.decode(b); function packedVarints(b){let a=[],p=0,v;while(p<b.length){[v,p]=readVarint(b,p);a.push(v)}return a} function doubles(b){let d=new DataView(b.buffer,b.byteOffset,b.byteLength),a=[];for(let i=0;i<b.length;i+=8)a.push(d.getFloat64(i,true));return a}
function mapEntry(b){let k='',v='';for(let[f,w,x]of fields(b)){if(f===1&&w===2)k=text(x);else if(f===2&&w===2)v=text(x)}return[k,v]}
function node(b){let n={cls:'',method:'',desc:'',line:0,times:[],children:[]};for(let[f,w,x]of fields(b)){if(f===3&&w===2)n.cls=text(x);else if(f===4&&w===2)n.method=text(x);else if(f===6&&w===0)n.line=x;else if(f===7&&w===2)n.desc=text(x);else if(f===8)n.times.push(...(w===2?doubles(x):[new DataView(x.buffer,x.byteOffset,8).getFloat64(0,true)]));else if(f===9)n.children.push(...(w===2?packedVarints(x):[x]))}return n}
function thread(b){let t={name:'',nodes:[],times:[],roots:[]};for(let[f,w,x]of fields(b)){if(f===1&&w===2)t.name=text(x);else if(f===3&&w===2)t.nodes.push(node(x));else if(f===4)t.times.push(...(w===2?doubles(x):[]));else if(f===5)t.roots.push(...(w===2?packedVarints(x):[x]))}return t}
function pluginMeta(b){for(let[f,w,x]of fields(b))if(f===1&&w===2)return text(x);return ''}
function metadata(b,p){for(let[f,w,x]of fields(b)){if(f===2&&w===0)p.start=x;else if(f===3&&w===0)p.interval=x;else if(f===11&&w===0)p.end=x;else if(f===12&&w===0)p.ticks=x;else if(f===15&&w===0)p.mode=x;else if(f===13&&w===2){let key='',name='';for(let[ef,ew,ex]of fields(x)){if(ef===1&&ew===2)key=text(ex);else if(ef===2&&ew===2)name=pluginMeta(ex)}if(key)p.names[key]=name||key}}}
function parse(raw){let p={threads:[],classes:{},methods:{},lines:{},names:{},windows:[],interval:0,start:0,end:0,mode:0,ticks:0};for(let[f,w,x]of fields(raw)){if(f===1&&w===2)metadata(x,p);else if(f===2&&w===2)p.threads.push(thread(x));else if([3,4,5].includes(f)&&w===2){let[k,v]=mapEntry(x);if(k)(f===3?p.classes:f===4?p.methods:p.lines)[k]=v}else if(f===6)p.windows.push(...(w===2?packedVarints(x):[x]))}if(!p.threads.length)throw Error('No Spark SamplerData threads found.');return p}
function source(p,n){let c=[`${n.cls}#${n.method}${n.desc}`,`${n.cls}.${n.method}${n.desc}`,`${n.cls}#${n.method}`,`${n.cls}.${n.method}`];if(n.line)for(let base of c)for(let k of [`${base}:${n.line}`,`${base};${n.line}`])if(k in p.lines)return p.lines[k];for(let k of c)if(k in p.methods)return p.methods[k];return p.classes[n.cls]||null}
const frameworks=new Set(['packetevents','protocollib','viaversion','viabackwards','viarewind']);function isFramework(p,s){return !!s&&frameworks.has((p.names[s]||s).toLowerCase().replaceAll(' ',''))}
function barrier(n){let c=n.cls,m=n.method;if(c.startsWith('io.netty.channel.AbstractChannelHandlerContext'))return m.startsWith('invoke')||['write','fireChannelRead','read','flush','fireChannelReadComplete','fireExceptionCaught'].includes(m);if(c.startsWith('io.netty.channel.DefaultChannelPipeline')||c.startsWith('io.netty.channel.CombinedChannelDuplexHandler'))return true;if(['io.netty.channel.ChannelDuplexHandler','io.netty.channel.ChannelInboundHandlerAdapter','io.netty.channel.ChannelOutboundHandlerAdapter'].includes(c))return ['write','channelRead','read','flush'].includes(m);return false}
const sum=a=>a.reduce((x,y)=>x+y,0);function analyze(p,filter){let caused={},totalSelf=0;for(let t of p.threads){if(filter&&!t.name.toLowerCase().includes(filter.toLowerCase()))continue;let ns=t.nodes;function walk(i,active,seen){if(i<0||i>=ns.length||seen.has(i))return;let n=ns[i],inc=sum(n.times),own=source(p,n),inherited=barrier(n)?null:active,current;if(own)current=isFramework(p,own)&&inherited&&!isFramework(p,inherited)?inherited:own;else current=inherited;let cs=0,valid=[];for(let c of n.children)if(c>=0&&c<ns.length){cs+=sum(ns[c].times);valid.push(c)}let self=Math.max(0,inc-cs);totalSelf+=self;if(current)caused[current]=(caused[current]||0)+self;let nv=new Set(seen);nv.add(i);for(let c of valid)walk(c,current,nv)}for(let r of t.roots)walk(r,null,new Set)}return{caused,totalSelf}}
function rate(x){let a=Math.abs(x);if(a>=1024**3)return(x/1024**3).toFixed(3)+' GB/s';if(a>=1024**2)return(x/1024**2).toFixed(2)+' MB/s';if(a>=1024)return(x/1024).toFixed(2)+' KB/s';return x.toFixed(2)+' B/s'}
let current=null,fileName='';function render(){if(!current)return;let filter=document.querySelector('#filter').value.trim(),s=analyze(current,filter),dur=current.end&&current.start?(current.end-current.start)/1000:0,alloc=current.mode===1,rows=Object.entries(s.caused).map(([id,v])=>({plugin:current.names[id]||id,v}));rows.sort((a,b)=>b.v-a.v);let meta=`${fileName} · ${current.threads.length} threads · ${alloc?'allocation':'execution'} profile`+(filter?` · filter: “${filter}”`:'');document.querySelector('#meta').textContent=meta;let html;if(alloc){if(!dur)throw Error('Allocation profile has no usable duration.');html='<table><thead><tr><th>Plugin</th><th>Alloc rate</th><th>Thread %</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${esc(r.plugin)}</td><td>${rate(r.v/dur)}</td><td>${(100*r.v/s.totalSelf).toFixed(2)}%</td></tr>`).join('')+'</tbody></table>'}else{if(!current.ticks)throw Error('Execution profile has no number_of_ticks; exact MSPT/CPU cannot be calculated.');html='<table><thead><tr><th>Plugin</th><th>MSPT</th><th>CPU usage</th></tr></thead><tbody>'+rows.map(r=>{let m=r.v/current.ticks;return`<tr><td>${esc(r.plugin)}</td><td>${m.toFixed(3)}</td><td>${(m/50*100).toFixed(2)}%</td></tr>`}).join('')+'</tbody></table>'}document.querySelector('#out').innerHTML=html;document.querySelector('#error').textContent=''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(f){try{fileName=f.name;current=parse(new Uint8Array(await f.arrayBuffer()));render()}catch(e){document.querySelector('#error').textContent=e.stack||e;document.querySelector('#out').innerHTML=''}}
let drop=document.querySelector('#drop'),fi=document.querySelector('#file');drop.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&load(fi.files[0]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};document.querySelector('#filter').oninput=()=>{try{render()}catch(e){document.querySelector('#error').textContent=e.message}};
</script></body></html>
